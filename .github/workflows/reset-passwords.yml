name: Reset passwords

# Đặt lại mật khẩu MỌI tài khoản đang hoạt động về một mật khẩu chung
# (scripts/reset-passwords.mjs). Chỉ chạy tay: Actions → Reset passwords →
# Run workflow, gõ RESET vào ô xác nhận.
# Cần 2 secret trong Settings → Secrets and variables → Actions:
#   BACKUP_DATABASE_URL = DIRECT_URL (dùng chung với workflow Backup)
#   RESET_PASSWORD      = mật khẩu chung muốn đặt (KHÔNG nhập ở ô input:
#                         input của workflow hiện công khai trong trang run).
# Chạy xong nên xoá secret RESET_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ RESET để đặt lại thật (để trống = chạy thử, chỉ liệt kê)"
        required: false
        default: ""
      force_change:
        description: "Bắt mỗi người tự đổi mật khẩu ở lần đăng nhập sau"
        type: boolean
        default: true
      allow_short:
        description: "Cho mật khẩu chung 8–9 ký tự (luật thường: từ 10 ký tự)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reset-passwords
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Đặt lại mật khẩu
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          RESET_PASSWORD: ${{ secrets.RESET_PASSWORD }}
          CONFIRM: ${{ inputs.confirm }}
          FORCE_CHANGE: ${{ inputs.force_change }}
          ALLOW_SHORT: ${{ inputs.allow_short }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Chưa đặt secret BACKUP_DATABASE_URL"; exit 1; fi
          if [ -z "$RESET_PASSWORD" ]; then echo "::error::Chưa đặt secret RESET_PASSWORD"; exit 1; fi
          args=()
          if [ "$CONFIRM" = "RESET" ]; then args+=(--apply); fi
          if [ "$FORCE_CHANGE" != "true" ]; then args+=(--no-force-change); fi
          if [ "$ALLOW_SHORT" = "true" ]; then args+=(--allow-short); fi
          node scripts/reset-passwords.mjs "${args[@]}"
